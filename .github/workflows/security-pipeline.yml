name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST - Static Code Analysis
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r app.py -f json -o bandit-report.json || true
          bandit -r app.py

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-sast-report
          path: bandit-report.json

  dependency-scan:
    name: SCA - Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --format=json --output=pip-audit-report.json || true

      - name: Show results
        run: pip-audit -r requirements.txt

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-report
          path: pip-audit-report.json

  docker-build-scan:
    name: Container Build and Image Scan
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-demo:${{ github.sha }} .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-demo:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

  pipeline-summary:
    name: Security Gate - All Clear
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast-scan, dependency-scan, docker-build-scan]
    steps:
      - name: Pipeline passed
        run: |
          echo "All security gates passed."
          echo "Secrets scan: PASSED"
          echo "SAST scan: PASSED"
          echo "Dependency scan: PASSED"
          echo "Container scan: PASSED"
